"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
# Dogfood: expose the working-tree bento skills to Claude and Codex in this repo (see AGENTS.md).
setup = "for l in .agents/skills .claude/skills; do [ -L $l ] || [ ! -e $l ] || { echo \"$l is a real directory; move it away first\" >&2; exit 1; }; done && mkdir -p .agents .claude && ln -sfn ../plugins/bento/skills .agents/skills && ln -sfn ../.agents/skills .claude/skills"
