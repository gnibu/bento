schema_version: '1.0'
name: workflow-run-evals
tags:
- workflow
- workflow-change
execution:
  prompt: Run the existing evaluation suite once with python3 -m unittest and report its result.
    This is a routine existing-suite run, with no model/prompt comparison, optimization, or new behavior
    to test.
  max_turns: 10
  timeout_seconds: 240
  allowed_tools:
  - Skill
  - Read
  - Glob
  - Grep
  - Bash
graders:
- type: llm
  name: ran-existing-suite
  criteria: PASS if python3 -m unittest is actually run and the existing two passing tests are reported.
    Do not set up an A/B comparison, a tuning experiment, new tests, or a new test runner.
  focus: trace
- type: tool_used
  name: no-comparison
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[^"]*:)?bento-eval-blind"'
  min: 0
  max: 0
  arm: both
- type: tool_used
  name: no-tuning
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[^"]*:)?bento-hillclimb"'
  min: 0
  max: 0
  arm: both
context:
  scaffold_script: setup.sh
