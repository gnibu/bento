schema_version: '1.0'
name: workflow-plan-only
tags:
- workflow
- workflow-change
execution:
  prompt: 'Plan only: sequence adding an optional greeting prefix through formatter.py, app.py, and
    cli.py into independently verifiable units. Default "hi" remains; the CLI gains --prefix. Write
    the plan and name evidence for each unit. Do not implement or change application/test files.
    Work solo.'
  max_turns: 12
  timeout_seconds: 240
  allowed_tools:
  - Skill
  - Read
  - Glob
  - Grep
  - Bash
  - Write
  - Edit
graders:
- type: llm
  name: plan-only
  criteria: PASS if an actual plan artifact orders formatter, app, CLI units and names tests/live
    CLI/regression evidence, while no application or test code is changed. Planning is the requested
    deliverable, not permission to implement.
  focus: trace
- type: tool_used
  name: fired
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[^"]*:)?bento-multi-phase-plan"'
  arm: with-only
- type: tool_used
  name: no-source-write
  tool: Write
  input_match: '"file_path"\s*:\s*"(?:[^"]*/)?(?:app|formatter|cli|test_app)\.py"'
  min: 0
  max: 0
  arm: both
- type: tool_used
  name: no-source-edit
  tool: Edit
  input_match: '"file_path"\s*:\s*"(?:[^"]*/)?(?:app|formatter|cli|test_app)\.py"'
  min: 0
  max: 0
  arm: both
context:
  scaffold_script: setup.sh
