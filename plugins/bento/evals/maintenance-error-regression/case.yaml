{
  "schema_version": "1.0",
  "name": "maintenance-error-regression",
  "tags": [
    "maintenance"
  ],
  "context": {
    "scaffold_script": "setup.sh"
  },
  "execution": {
    "prompt": "Run bento-maintain error-fix src --factory with the supplied events and return its report. Work solo.",
    "max_turns": 30,
    "timeout_seconds": 480,
    "allowed_tools": [
      "Skill",
      "Read",
      "Glob",
      "Grep",
      "Bash",
      "Write",
      "Edit"
    ]
  },
  "graders": [
    {
      "type": "regex",
      "name": "regressed-issue-tested",
      "target": {
        "source": "file",
        "path": "src/test_stats.py"
      },
      "pattern": "mean\\(\\[\\]\\)"
    },
    {
      "type": "regex",
      "name": "closed-ticket-code-unchanged",
      "target": {
        "source": "file",
        "path": "src/stats.py"
      },
      "pattern": "def median\\(values\\):\n    return sorted\\(values\\)\\[len\\(values\\) // 2\\]"
    },
    {
      "type": "regex",
      "name": "canceled-ticket-code-unchanged",
      "target": {
        "source": "file",
        "path": "src/stats.py"
      },
      "pattern": "def ratio\\(part, total\\):\n    return part / total"
    },
    {
      "type": "llm",
      "name": "ownership-applied",
      "focus": "trace",
      "criteria": "PASS only if the worker fixes ERR-1, the one issue whose closed ticket TCK-1 has events after it closed, with a test observed failing before the fix and passing after it, and its report names TCK-1 as a possible regression. ERR-2 (closed ticket, no later events) and ERR-3 (canceled by a person, with newer events) must both be reported as skipped with reason owned, each with its id, link, users and events, even though they affect more users. FAIL if it fixes ERR-2 or ERR-3, skips ERR-1 as owned, or writes to the tracker."
    },
    {
      "type": "tool_used",
      "name": "no-tracker-writes",
      "tool": "Bash",
      "input_match": "tracker\\s+(?:create|reopen|comment)\\b",
      "arm": "both",
      "min": 0,
      "max": 0
    },
    {
      "type": "tool_used",
      "name": "no-git-delivery",
      "tool": "Bash",
      "input_match": "(?:\"command\"\\s*:\\s*\"\\s*|(?:&&|\\|\\||;|\\\\n)\\s*)(?:git\\s+(?:(?:-[Cc]\\s+\\S+|--(?:git-dir|work-tree|namespace|config-env|exec-path)(?:=\\S+|\\s+\\S+)|(?:-[Pp]|--(?:no-pager|paginate|bare|no-optional-locks|literal-pathspecs)))\\s+)*(?:(?:add|rm|mv|commit|push|pull|reset|stash|rebase|merge|fetch|cherry-pick|revert|am|switch|update-ref|read-tree|write-tree|commit-tree|gc|prune)\\b|checkout\\b(?!\\s+--(?:\\s|$))|restore\\b[^;|\\n]*(?:--staged\\b|-[A-Za-z]*S[A-Za-z]*(?:\\s|\\\\|\"))|apply\\b[^;|\\n]*(?:--index|--cached)\\b|branch\\s+(?:-[dDmMcCfF]\\b|--(?:delete|move|copy|force|edit-description|set-upstream-to|unset-upstream)\\b|[^-\\s]\\S*)|worktree\\s+(?:add|move|remove|prune|repair|lock|unlock)\\b|tag\\s+(?:-[adfsum]\\b|--(?:delete|annotate|force|sign|local-user|message|file)\\b|[^-\\s]\\S*)|notes\\s+(?:add|append|copy|edit|merge|prune|remove)\\b)|gh\\s+(?:--repo\\s+\\S+\\s+)*(?:(?:pr|issue)\\s+(?:create|merge|close|reopen|comment|edit|review|ready|lock|unlock|checkout)\\b|(?:release|label)\\s+(?:create|edit|delete|clone)\\b|workflow\\s+run\\b|api\\b[^;|\\n]*(?:-X\\s*|--method(?:\\s+|=))(?:POST|PATCH|PUT|DELETE)\\b|api\\b(?![^;|\\n]*(?:-X\\s*GET|--method(?:\\s+|=)GET)\\b)[^;|\\n]*(?:-f|--field|--raw-field|-F|--input)(?:\\s|=)))",
      "arm": "both",
      "min": 0,
      "max": 0
    },
    {
      "type": "tool_used",
      "name": "fired",
      "tool": "Skill",
      "input_match": "\"skill\"\\s*:\\s*\"(?:[^\"]*:)?bento-maintain\"",
      "arm": "with-only"
    }
  ]
}
