schema_version: '1.0'
name: setup-missing-skills
tags:
- setup
context:
  scaffold_script: setup.sh
execution:
  prompt: I just ran npx skills update for bento in this repo. Run bento-setup --yes, but only the
    install part; skip the principles, link, review gate, preferences and verification steps.
  max_turns: 15
  timeout_seconds: 300
  allowed_tools:
  - Skill
  - Read
  - Glob
  - Grep
  - Bash
graders:
# The eval sandbox has no network, so the install itself can't run; pin the check and the report.
- type: tool_used
  name: lists-bento-skills
  tool: Bash
  input_match: npx skills add gnibu/bento [^"]*--list
- type: llm
  name: reports-wup-missing
  criteria: PASS only if the run looked for bento skills missing from .agents/skills/ and the final
    reply names wup as missing, with either a run of `npx skills add gnibu/bento --skill wup ...` or,
    when that could not run, that command for the user to run. FAIL if it claims every bento skill is
    installed, or only suggests rerunning npx skills update.
  focus: trace
- type: tool_used
  name: fired
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[^"]*:)?bento-setup"'
  arm: with-only
