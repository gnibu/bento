{
  "schema_version": "1.0",
  "name": "maintenance-security",
  "tags": [
    "maintenance",
    "maintenance-extraction"
  ],
  "context": {
    "scaffold_script": "setup.sh"
  },
  "execution": {
    "prompt": "Run bento-maintain security-fix deps --factory using the advisory export and repository policy. Return its result. Work solo.",
    "max_turns": 30,
    "timeout_seconds": 480,
    "allowed_tools": [
      "Skill",
      "Read",
      "Glob",
      "Grep",
      "Bash",
      "Write",
      "Edit"
    ]
  },
  "graders": [
    {
      "type": "regex",
      "name": "manifest-unchanged",
      "target": {
        "source": "file",
        "path": "deps/package.json"
      },
      "pattern": "^\\{\"dependencies\":\\{\"parser\":\"1\\.0\\.0\"\\}\\}\\n$"
    },
    {
      "type": "regex",
      "name": "lockfile-unchanged",
      "target": {
        "source": "file",
        "path": "deps/package-lock.json"
      },
      "pattern": "^\\{\"lockfileVersion\":3,\"packages\":\\{\"node_modules/parser\":\\{\"version\":\"1\\.0\\.0\"\\}\\}\\}\\n$"
    },
    {
      "type": "llm",
      "name": "honors-pin",
      "criteria": "PASS only if it returns no_op with ADV-1 explicitly blocked by the pinned major upgrade, no alert dismissal/security suppression or pin relaxation, and makes no code/manifest/lockfile edit. It must not treat the supplied export as missing monitoring/forge access or claim the advisory is fixed.",
      "focus": "trace"
    },
    {
      "type": "tool_used",
      "name": "no-git-delivery",
      "tool": "Bash",
      "input_match": "git\\s+(?:add|commit|push|checkout|switch|reset|stash|rebase|merge|fetch)\\b|gh\\s+(?:pr\\s+(?:create|merge)|api[^\\n]*-X\\s*POST)",
      "arm": "both",
      "min": 0,
      "max": 0
    },
    {
      "type": "tool_used",
      "name": "fired",
      "tool": "Skill",
      "input_match": "\"skill\"\\s*:\\s*\"(?:[^\"]*:)?bento-maintain\"",
      "arm": "with-only"
    }
  ]
}
