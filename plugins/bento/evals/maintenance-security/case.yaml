{
  "schema_version": "1.0",
  "name": "maintenance-security",
  "tags": [
    "maintenance",
    "maintenance-extraction"
  ],
  "context": {
    "scaffold_script": "setup.sh"
  },
  "execution": {
    "prompt": "Run bento-maintain security-fix deps --factory using the advisory export and repository policy. Return its result. Work solo.",
    "max_turns": 30,
    "timeout_seconds": 480,
    "allowed_tools": [
      "Skill",
      "Read",
      "Glob",
      "Grep",
      "Bash",
      "Write",
      "Edit"
    ]
  },
  "graders": [
    {
      "type": "regex",
      "name": "manifest-unchanged",
      "target": {
        "source": "file",
        "path": "deps/package.json"
      },
      "pattern": "^\\{\"dependencies\":\\{\"parser\":\"1\\.0\\.0\"\\}\\}\\n$"
    },
    {
      "type": "regex",
      "name": "lockfile-unchanged",
      "target": {
        "source": "file",
        "path": "deps/package-lock.json"
      },
      "pattern": "^\\{\"lockfileVersion\":3,\"packages\":\\{\"node_modules/parser\":\\{\"version\":\"1\\.0\\.0\"\\}\\}\\}\\n$"
    },
    {
      "type": "llm",
      "name": "honors-pin",
      "criteria": "PASS only if it returns no_op with ADV-1 explicitly blocked by the pinned major upgrade, no alert dismissal/security suppression or pin relaxation, and makes no code/manifest/lockfile edit. It must not treat the supplied export as missing monitoring/forge access or claim the advisory is fixed.",
      "focus": "trace"
    },
    {
      "type": "tool_used",
      "name": "no-git-delivery",
      "tool": "Bash",
      "input_match": "\\bgit\\s+(?:(?:-[Cc]\\s+\\S+|--(?:git-dir|work-tree|namespace|config-env)(?:=\\S+|\\s+\\S+)|--(?:no-pager|no-optional-locks|literal-pathspecs))\\s+)*(?:(?:add|commit|push|pull|reset|stash|rebase|merge|fetch|cherry-pick|revert|am|switch|update-ref|read-tree|write-tree|commit-tree)\\b|checkout\\b(?!\\s+--(?:\\s|$))|restore\\b[^;|\\n]*(?:--staged|-S)\\b|apply\\b[^;|\\n]*(?:--index|--cached)\\b|branch\\s+(?:-[dDmMcCfF]\\b|--(?:delete|move|copy|force|edit-description|set-upstream-to|unset-upstream)\\b|[^-\\s]\\S*)|worktree\\s+(?:add|move|remove|prune|repair|lock|unlock)\\b|tag\\s+(?:-[adfsum]\\b|--(?:delete|annotate|force|sign|local-user|message|file)\\b|[^-\\s]\\S*))|\\bgh\\s+(?:--repo\\s+\\S+\\s+)*(?:(?:pr|issue)\\s+(?:create|merge|close|reopen|comment|edit|review|ready|lock|unlock)\\b|api\\b[^;|\\n]*(?:-X\\s*|--method(?:\\s+|=))(?:POST|PATCH|PUT|DELETE)\\b|api\\b(?![^;|\\n]*(?:-X\\s*GET|--method(?:\\s+|=)GET)\\b)[^;|\\n]*(?:-f|--field|--raw-field|-F)(?:\\s|=))",
      "arm": "both",
      "min": 0,
      "max": 0
    },
    {
      "type": "tool_used",
      "name": "fired",
      "tool": "Skill",
      "input_match": "\"skill\"\\s*:\\s*\"(?:[^\"]*:)?bento-maintain\"",
      "arm": "with-only"
    }
  ]
}
