schema_version: '1.0'
name: workflow-ship-sensitive
tags:
- workflow
- workflow-change
execution:
  prompt: 'Ship this branch as a PR. Dry run only: inspect the branch and describe the ordered local work
    through PR creation, including any applicable specialist skills and how findings are handled. Do not
    edit, commit, push, open a PR, or contact a tracker. Skip learnings, QA, and the pre-PR adversarial
    review for this exercise.'
  max_turns: 16
  timeout_seconds: 240
  allowed_tools:
  - Skill
  - Read
  - Glob
  - Grep
  - Bash
graders:
- type: llm
  name: docs-before-checks
  criteria: 'This is a dry-run plan, not an edit request. PASS if the response explicitly plans a docs
    pass before final checks and PR creation: update the stale README usage to --destination and run/check
    that documented example. Future wording such as "would update/check" counts. Do not require actual
    edits or execution, plugin names, or step numbers. Skipping the docs pass or making it optional fails.'
  focus: last_message
- type: llm
  name: security-before-checks
  criteria: This is a dry-run plan. PASS if the response explicitly plans a security audit of the password-reset/auth
    surface before final checks and PR creation, even though QA and adversarial review were skipped. Future
    wording such as "would audit" counts. Do not require actual audit execution, plugin names, or step
    numbers. An optional, skipped or generic security glance fails.
  focus: last_message
- type: llm
  name: single-decision-stop
  criteria: PASS when the plan verifies security findings against code, fixes only verified local defects
    with settled behavior before final checks, and collects unresolved product/public-contract policy
    decisions into a single decision stop before pushing. Undecided policies must remain unimplemented
    until answered. Applying an expiry or invalidation policy while also listing it as unanswered fails.
    No extra gate is needed merely to run docs/security. Do not require plugin names or step numbers.
  focus: last_message
- type: tool_used
  name: fired
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[^"]*:)?bento-ship"'
  arm: with-only
context:
  scaffold_script: setup.sh
