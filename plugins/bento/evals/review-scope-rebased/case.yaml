schema_version: "1.0"
name: review-scope-rebased
tags: [review-scope]
context:
  scaffold_script: setup.sh
execution:
  prompt: "Run an adversarial review of my branch. First step only: tell me which commits you will send to the reviewer, why, and the exact diff command. Stop before launching the reviewer."
  max_turns: 12
  allowed_tools: [Skill, Read, Glob, Grep, Bash]
graders:
  - type: llm
    name: scope
    criteria: |
      The recorded reviewed sha is a commit that is not an ancestor of HEAD (rebased away). PASS only if the chosen scope is the whole branch against origin/master (a diff like
      `git diff origin/master...HEAD`). FAIL if the scope is limited to commits since a recorded sha.
  - type: tool_used
    name: fired
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[^"]*:)?bento-adversarial-review"'
    arm: with-only
