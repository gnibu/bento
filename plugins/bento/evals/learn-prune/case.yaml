schema_version: "1.0"
name: learn-prune
tags: [learn]
context:
  scaffold_script: setup.sh
execution:
  prompt: |
    Run bento-learn on this branch. What it surfaced: I pushed this branch twice with a type
    error, and CI failed both times. `make lint` doesn't run the type checker; CI also runs
    `make typecheck` (mypy + tsc), and every change in this repo, api or web, needs both before
    a push.
    Propose the exact diffs per destination. Do not apply anything.
  max_turns: 25
  allowed_tools: [Skill, Read, Glob, Grep, Bash, Write]
graders:
  - type: llm
    name: drops-principle-restatement
    criteria: |
      The root AGENTS.md has a repo line "Asked to commit or open a PR: run bento-ship.", which
      only restates the "Ship through bento-ship" principle already in the file's bento block.
      PASS if a proposed diff deletes that line. FAIL if no diff removes it.
  - type: llm
    name: drops-stale-or-overlap
    criteria: |
      The root AGENTS.md names `scripts/format.sh`, which does not exist (`make format` does),
      and says twice to run `make test` before pushing / before every PR.
      PASS if the proposed diffs fix or delete the `scripts/format.sh` line AND merge or delete
      one of the two `make test` lines. FAIL if either is left as it is.
  - type: llm
    name: moves-e2e-gotchas
    criteria: |
      The root AGENTS.md has a "Web e2e tests" section of about 30 lines, all about web/e2e/,
      which has no AGENTS.md of its own.
      PASS if a proposed diff moves that section (most of its lines) out of the root file to
      web/e2e/AGENTS.md or web/AGENTS.md (or a README or doc under web/), removing it from the
      root. FAIL if the section stays in the root AGENTS.md with no proposal to move it.
  - type: llm
    name: keeps-the-learning-lean
    criteria: |
      The root AGENTS.md already has "- Lint: `make lint` (ruff + eslint)." PASS if the
      typecheck learning is proposed by changing that existing line (or merging it with the
      `make test` lines into one pre-push line) rather than adding a separate new line beside
      it. FAIL if a new, separate typecheck or pre-push line is added and the lint line stays.
  - type: tool_used
    name: fired
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[^"]*:)?bento-learn"'
    arm: with-only
