schema_version: "1.0"
name: setup-preferences-filled
tags: [preferences]
context:
  scaffold_script: setup.sh
execution:
  prompt: "Run bento setup in this repo. This is a dry run: skip the install checks, wiring and verification, write no file, and tell me exactly which questions, if any, you would ask me about this repo, and what you would write."
  max_turns: 15
  allowed_tools: [Skill, Read, Glob, Grep, Bash]
graders:
  - type: llm
    name: asks-nothing
    criteria: |
      The repo is a fresh checkout whose AGENTS.md names GitHub, the tracker Linear and the review status `In Review`, but no Linear team or project. The user asked for a dry run of bento setup. The overlay .agents/bento/bento-ship.md already records every ship preference
      (missing ticket, ticket update, tracker with team ENG, QA, pre-PR review, pre-PR review gate, learnings, PR
      reviewers), and the AGENTS.md principles block records terse reports `off`.
      PASS only if the response asks the user no preference question, terse reports included,
      and would leave the recorded preferences unchanged, with terse reports still off. FAIL if
      it would ask any preference question or rewrite the preferences. Writing other setup
      files (e.g. a new .agents/bento/bento-maintain.md) is fine.
  - type: tool_used
    name: fired
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[^"]*:)?bento-setup"'
    arm: with-only
