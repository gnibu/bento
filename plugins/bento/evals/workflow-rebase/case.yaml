schema_version: '1.0'
name: workflow-rebase
tags:
- workflow
- workflow-change
execution:
  prompt: Rebase this branch on master.
  max_turns: 12
  timeout_seconds: 180
  allowed_tools:
  - Skill
  - Read
  - Glob
  - Grep
  - Bash
graders:
- type: tool_used
  name: no-ship
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[^"]*:)?bento-ship"'
  min: 0
  max: 0
  arm: with-only
- type: tool_used
  name: rebased
  tool: Bash
  input_match: \bgit\s+(?:-\S+\s+(?:[^-\s]\S*\s+)?)*rebase\b
  arm: both
- type: tool_used
  name: no-push
  tool: Bash
  input_match: \bgit\s+(?:-\S+\s+(?:[^-\s]\S*\s+)?)*push\b
  min: 0
  max: 0
  arm: both
context:
  scaffold_script: setup.sh
