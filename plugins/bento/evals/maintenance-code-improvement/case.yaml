{
  "schema_version": "1.0",
  "name": "maintenance-code-improvement",
  "tags": [
    "maintenance",
    "maintenance-extraction"
  ],
  "context": {
    "scaffold_script": "setup.sh"
  },
  "execution": {
    "prompt": "Run bento-maintain code-improvement src --factory. Use the repository's supplied ownership snapshot. Complete one useful improvement and return its report. Work solo.",
    "max_turns": 30,
    "timeout_seconds": 480,
    "allowed_tools": [
      "Skill",
      "Read",
      "Glob",
      "Grep",
      "Bash",
      "Write",
      "Edit"
    ]
  },
  "graders": [
    {
      "type": "regex",
      "name": "uses-existing-helper",
      "target": {
        "source": "file",
        "path": "src/customer.py"
      },
      "pattern": "(?:from shared import normalize|import shared)"
    },
    {
      "type": "llm",
      "name": "proved-equivalence",
      "criteria": "PASS only if customer_key delegates to shared.normalize, existing test assertions remain unchanged, a passing behavior pin runs before the refactor and checks pass after it. The final report gives an outcome and actual command/results. No branch/commit/PR/tracker action. A plan-only answer fails.",
      "focus": "trace"
    },
    {
      "type": "tool_used",
      "name": "no-git-delivery",
      "tool": "Bash",
      "input_match": "\\bgit\\s+(?:(?:-[Cc]\\s+\\S+|--(?:git-dir|work-tree|namespace|config-env)(?:=\\S+|\\s+\\S+)|--(?:no-pager|no-optional-locks|literal-pathspecs))\\s+)*(?:(?:add|commit|push|pull|reset|stash|rebase|merge|fetch|cherry-pick|revert|am|switch|update-ref|read-tree|write-tree|commit-tree)\\b|checkout\\b(?!\\s+--(?:\\s|$))|restore\\b[^;|\\n]*(?:--staged|-S)\\b|apply\\b[^;|\\n]*(?:--index|--cached)\\b|branch\\s+(?:-[dDmMcCfF]\\b|--(?:delete|move|copy|force|edit-description|set-upstream-to|unset-upstream)\\b|[^-\\s]\\S*)|worktree\\s+(?:add|move|remove|prune|repair|lock|unlock)\\b|tag\\s+(?:-[adfsum]\\b|--(?:delete|annotate|force|sign|local-user|message|file)\\b|[^-\\s]\\S*))|\\bgh\\s+(?:--repo\\s+\\S+\\s+)*(?:(?:pr|issue)\\s+(?:create|merge|close|reopen|comment|edit|review|ready|lock|unlock)\\b|api\\b[^;|\\n]*(?:-X\\s*|--method(?:\\s+|=))(?:POST|PATCH|PUT|DELETE)\\b|api\\b(?![^;|\\n]*(?:-X\\s*GET|--method(?:\\s+|=)GET)\\b)[^;|\\n]*(?:-f|--field|--raw-field|-F)(?:\\s|=))",
      "arm": "both",
      "min": 0,
      "max": 0
    },
    {
      "type": "tool_used",
      "name": "fired",
      "tool": "Skill",
      "input_match": "\"skill\"\\s*:\\s*\"(?:[^\"]*:)?bento-maintain\"",
      "arm": "with-only"
    }
  ]
}
