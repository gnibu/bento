schema_version: '1.0'
name: workflow-spec-only
tags:
- workflow
- workflow-change
execution:
  prompt: Write a requirements spec only for blank-name handling in this greeting library. None,
    empty, and whitespace become "anonymous"; all other names stay as they are. Include acceptance
    criteria for greet and shout. Do not implement or change application/test files.
  max_turns: 12
  timeout_seconds: 240
  allowed_tools:
  - Skill
  - Read
  - Glob
  - Grep
  - Bash
  - Write
  - Edit
graders:
- type: llm
  name: spec-only
  criteria: PASS if a spec artifact defines checkable greet/shout criteria for None, empty, whitespace
    and nonblank input, and application/test files are not changed. Implementation is explicitly
    outside this request.
  focus: trace
- type: tool_used
  name: fired
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[^"]*:)?bento-spec"'
  arm: with-only
- type: tool_used
  name: no-source-write
  tool: Write
  input_match: '"file_path"\s*:\s*"(?:[^"]*/)?(?:app|formatter|cli|test_app)\.py"'
  min: 0
  max: 0
  arm: both
- type: tool_used
  name: no-source-edit
  tool: Edit
  input_match: '"file_path"\s*:\s*"(?:[^"]*/)?(?:app|formatter|cli|test_app)\.py"'
  min: 0
  max: 0
  arm: both
context:
  scaffold_script: setup.sh
