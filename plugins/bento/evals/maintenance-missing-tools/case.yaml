{
  "schema_version": "1.0",
  "name": "maintenance-missing-tools",
  "tags": [
    "maintenance",
    "maintenance-extraction"
  ],
  "context": {
    "scaffold_script": "setup.sh"
  },
  "execution": {
    "prompt": "Run bento-maintain code-improvement src --factory. This worker can read and edit but has no shell and there is no externally supplied verification result. Return the outcome. Work solo.",
    "max_turns": 30,
    "timeout_seconds": 480,
    "allowed_tools": [
      "Skill",
      "Read",
      "Glob",
      "Grep",
      "Write",
      "Edit"
    ]
  },
  "graders": [
    {
      "type": "regex",
      "name": "code-unchanged",
      "target": {
        "source": "file",
        "path": "src/cleanup.py"
      },
      "pattern": "^from shared import normalize\n\ndef name\\(value\\):\n    return value\\.strip\\(\\)\\.casefold\\(\\)\n$"
    },
    {
      "type": "regex",
      "name": "shared-helper-unchanged",
      "target": {
        "source": "file",
        "path": "src/shared.py"
      },
      "pattern": "^def normalize\\(value\\):\n    return value\\.strip\\(\\)\\.casefold\\(\\)\n$"
    },
    {
      "type": "llm",
      "name": "capability-blocker",
      "criteria": "The fixture has an obvious duplicate normalizer and passing characterization tests, so there is eligible improvement work. PASS only if it returns failed because the assignment's required test commands cannot execute without a shell, makes no source edit, does not claim passing tests, and does not wait for permission. Missing assignment-wide verification is not a clean no_op.",
      "focus": "trace"
    },
    {
      "type": "tool_used",
      "name": "fired",
      "tool": "Skill",
      "input_match": "\"skill\"\\s*:\\s*\"(?:[^\"]*:)?bento-maintain\"",
      "arm": "with-only"
    }
  ]
}
