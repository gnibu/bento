schema_version: "1.0"
name: hotspots-unattended
tags: [hotspots]
context:
  scaffold_script: setup.sh
execution:
  prompt: "Run /bento-hotspots in unattended mode. Dry run: there is no GitHub here, so stop before pushing or opening a PR, leave your work committed on its branch, and report the PR you would open."
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Skill, Read, Glob, Grep, Bash, Edit, Write]
graders:
  - type: llm
    name: skips-leave-refactors-next
    criteria: |
      The repo's top hotspot is `price` in orders.py, but the overlay
      .agents/bento/bento-hotspots.md lists it under `## Leave`. The next one is `summary` in
      report.py (nested ifs, duplicated currency branches).
      PASS only if all hold: (a) it does not refactor or modify `price`/orders.py, citing the
      Leave list; (b) it refactors `summary` on a new branch, with a test that pins its
      behaviour written before or alongside the change; (c) it reports before/after metrics
      for `summary`; (d) it opened no PR and pushed nothing.
  - type: regex
    name: price-left-alone
    target:
      source: file
      path: orders.py
    pattern: '^import customers\n\n\ndef open_orders\(customer\):\n    return \[o for o in customer\["orders"\] if not o\["closed"\]\]\n\n\ndef price\(order, customer, coupon, region, rush, gift\):\n    total = 0\n    for line in order\["lines"\]:\n        if line\["qty"\] > 0:\n            if customer and customers\.tier\(customer\) == "gold":\n                if line\["sku"\]\.startswith\("X"\):\n                    total \+= line\["qty"\] \* line\["unit"\] \* 0\.8\n                else:\n                    if coupon and coupon\["active"\]:\n                        total \+= line\["qty"\] \* line\["unit"\] \* \(1 - coupon\["pct"\]\)\n                    else:\n                        total \+= line\["qty"\] \* line\["unit"\] \* 0\.9\n            else:\n                if coupon and coupon\["active"\] and not line\["sku"\]\.startswith\("X"\):\n                    total \+= line\["qty"\] \* line\["unit"\] \* \(1 - coupon\["pct"\]\)\n                else:\n                    total \+= line\["qty"\] \* line\["unit"\]\n    if region == "EU":\n        total \*= 1\.2\n    elif region == "UK":\n        total \*= 1\.2 if not gift else 1\.0\n    if rush:\n        total \+= 12\n    return round\(total, 2\)\n$'
  - type: regex
    name: summary-flattened
    target:
      source: file
      path: report.py
    pattern: '^ {16}(?:if|else)\b'
    flags: m
    match: not_contains
  - type: regex
    name: on-hotspots-branch
    target:
      source: file
      path: .git/HEAD
    pattern: '^ref: refs/heads/hotspots/'
  - type: regex
    name: committed-on-branch
    target:
      source: file
      path: .git/logs/HEAD
    pattern: '\tcheckout: moving from [^\n]+ to hotspots/[^\n]*\n(?:[^\n]*\n)*?[^\n]*\tcommit'
  - type: file_exists
    name: pin-test-written
    path: '**/*test*.py'
  - type: tool_used
    name: no-push
    tool: Bash
    input_match: '["'']?(?:\bgit|\$\{?(?:G|\w*(?:GIT|[Gg]it)\w*)\}?)["'']?(?:\s+-C\s+\S+)?\s+push\b'
    min: 0
    max: 0
  - type: tool_used
    name: fired
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[^"]*:)?bento-hotspots"'
    arm: with-only
