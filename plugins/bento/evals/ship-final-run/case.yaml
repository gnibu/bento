schema_version: "1.0"
name: ship-final-run
tags: [ship-final-run]
context:
  scaffold_script: setup.sh
execution:
  prompt: "Ship this branch as a PR. This is a dry run: read whatever you need (you may run read-only git commands and `npm run e2e -- --dry`), then list every step and every test or check command you would run, in order, from now until the PR is opened, including the reruns after QA fixes, the hotspots pass and the pre-PR review's fixes. Do not start servers, open a browser, run the test suites, edit, commit, push, open a PR or touch the tracker."
  max_turns: 15
  allowed_tools: [Skill, Read, Glob, Grep, Bash]
graders:
  - type: llm
    name: one-full-run
    criteria: |
      A web app: unit tests run with `npm test` (seconds); end-to-end tests run with `npm run e2e`
      or `npx playwright test <spec>` (slow). The response is a dry-run ship plan that lists its
      test commands in order.
      PASS only if, besides QA running a test it just wrote to see it fail and pass, the
      end-to-end tests run once: in a final run on the last commit before the push. They are not
      run in an earlier checks step, nor again after the hotspots pass, the pre-PR review's
      fixes or the stop's commits. A conditional rerun only if that final run goes red is fine;
      so is running `npm test` several times. `npm run e2e -- --dry` runs nothing: it does not
      count.
      FAIL if the end-to-end tests run in an earlier checks step or after a later fix step.
  - type: tool_used
    name: fired
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[^"]*:)?bento-ship"'
    arm: with-only
